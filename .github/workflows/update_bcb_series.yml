name: Atualizar séries do BCB (dólar e Selic)

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC (00:00 horário de Brasília)
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL || vars.NEON_DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validar DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: configure NEON_DATABASE_URL ou DATABASE_URL em Secrets ou Variables do repositório."
            exit 1
          fi

      - name: Atualizar pip e instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar tabela, se necessário
        run: python -c "from config.database import create_tables; create_tables()"

      - name: Rodar ingestão
        run: python -c "from scripts.etl import load_data; load_data()"
