services:
  # A coleta de dados roda diariamente no GitHub Actions
  # (.github/workflows/update_bcb_series.yml). Este serviço só exibe o dashboard.
  streamlit-app:
    build: .
    container_name: dolartracker_app
    ports:
      - "8502:8501"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in .env}
    restart: unless-stopped
