services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JAVA_TIMEZONE: America/Sao_Paulo
      # Sem isso, o banco H2 (onde o Metabase guarda dashboards, usuários e
      # conexões salvas) fica dentro do container e some se ele for recriado.
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  metabase_data:
