# render.yaml
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dolartracker-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dolartracker-db
          property: connectionString
      - key: BCB_API_URL
        value: https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados

databases:
  - name: dolartracker-db
    plan: free
    databaseName: dolar_db
    user: dolartracker
